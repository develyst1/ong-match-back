server {
    listen 80;
    server_name ong.develyst.online;
    location /.well-known/acme-challenge/ { root C:/nginx/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name ong.develyst.online;

    ssl_certificate     C:/nginx/ssl/ong.develyst.online-chain.pem;
    ssl_certificate_key C:/nginx/ssl/ong.develyst.online-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 25m;

    # NextAuth routes must be served by the Next.js frontend (NOT the backend).
    # More specific than /api/ below, so nginx matches this first for /api/auth/*.
    location /api/v1/auth/ {
        proxy_pass http://127.0.0.1:3017;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Backend (Bun) — routes are "/api/v1/...". Frontend must send "/api/v1/..."
    # (single /api). No strip: pass the full path straight through.
    location /api/ {
        proxy_pass http://127.0.0.1:4009;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Frontend (Next.js standalone)
    location / {
        proxy_pass http://127.0.0.1:3017;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
